spring:
  application:
    name: light-of-shadow-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/light_of_shadow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # 发信（启用 EmailCodeSender）。不配则用 DevCodeSender（日志回显验证码）
  # mail:
  #   host: smtp.qq.com
  #   port: 465
  #   username: ${MAIL_USERNAME:your@qq.com}
  #   password: ${MAIL_PASSWORD:your-smtp-auth-code}
  #   properties:
  #     mail.smtp.ssl.enable: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: org.yan.lightofshadowbackend.entity

server:
  port: 8080
  address: 0.0.0.0

app:
  auth:
    code:
      ttl: 5m
      resend-interval: 60s
      daily-limit: 10
      max-attempts: 5
      length: 6
    jwt:
      issuer: light-of-shadow-backend
      secret: ${JWT_SECRET:change-me-to-a-long-random-secret-for-production-please}
    access-token-ttl: 2h
    refresh-token-ttl: 30d
  storage:
    object:
      type: minio
      minio:
        endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        bucket: ${MINIO_BUCKET:product-images}
        public-base-url: ${MINIO_PUBLIC_URL:http://132.232.75.62:9000}
        presign-ttl-seconds: 900
    local:
      base-dir: uploads
      base-url: /media
      max-file-size-bytes: 5242880

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

# Python Agent 网关（导购消息转发；不可用时回退本地 LLM）
agent:
  base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
  connect-timeout-ms: 2000
  read-timeout-ms: 35000
  fallback-enabled: true



